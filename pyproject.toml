[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-iot"
version = "0.1.0"
description = "Smart home monitoring and control on AWS IoT, with Grafana, Alexa and a watch app"
requires-python = ">=3.12"
# boto3 is provided by the Lambda runtime; it is listed for local runs and tests.
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = [
    "moto[dynamodb,sns,iot,iotdata]>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["cloud/src"]

[tool.pytest.ini_options]
testpaths = ["cloud/tests"]
pythonpath = ["cloud/src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["smarthome", "tools"]
